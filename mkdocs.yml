site_name: Andor's Trail Wiki
site_description: Always-current reference for Andor's Trail, generated from the game's open-source data.
theme:
  name: material
  font: { text: Alegreya Sans, code: JetBrains Mono }
  palette:
    - scheme: slate
      primary: custom
      accent: custom
  features: [navigation.tabs, navigation.top, navigation.sections, search.suggest, search.highlight, content.code.copy]
extra_css: [stylesheets/extra.css]
extra_javascript: [javascripts/maps.js]
plugins: [search]
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - toc: { permalink: true }
nav:
  - Home: index.md
  - Items: items/index.md
  - Monsters: monsters/index.md
  - Stats & Skills:
      - Overview: skills/index.md
      - Stat glossary: skills/stats.md
  - Strategy:
      - strategy/index.md
      - Levelling & skill points: strategy/levelling.md
      - Combat tips: strategy/combat.md
  - Quests: quests/index.md
  - World map: maps/index.md
  - Changelog: changelog.md
not_in_nav: |
  /items/*.md
  /monsters/*.md
  /skills/*.md
  /quests/*.md
  /maps/*.md
validation: { links: { not_found: info, unrecognized_links: info }, nav: { omitted_files: info } }
