name: Update wiki from latest game release
on:
  schedule: [{ cron: '17 * * * *' }]   # hourly
  workflow_dispatch:                    # manual "Run workflow" button (forces a rebuild)
permissions: { contents: write }
concurrency: { group: wiki, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Check for a new release tag
        id: check
        run: |
          LATEST=$(git ls-remote --tags --refs https://github.com/AndorsTrailRelease/andors-trail.git 'v*' \
                   | sed 's#.*refs/tags/v##' | grep -E '^[0-9]+(\.[0-9]+)+$' | sort -V | tail -1)
          CURRENT=$(cat data/VERSION 2>/dev/null || echo none)
          echo "Latest release: $LATEST / wiki built from: $CURRENT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ -n "$LATEST" ] && { [ "$LATEST" != "$CURRENT" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; }; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch game data at that release
        if: steps.check.outputs.build == 'true'
        run: |
          git clone --depth 1 --branch "v${{ steps.check.outputs.latest }}" --filter=blob:none --sparse \
            https://github.com/AndorsTrailRelease/andors-trail.git game
          cd game && git sparse-checkout set AndorsTrail/res AndorsTrail/app/src/main/java
      - uses: actions/setup-python@v5
        if: steps.check.outputs.build == 'true'
        with: { python-version: '3.12' }
      - name: Build and deploy
        if: steps.check.outputs.build == 'true'
        run: |
          pip install "mkdocs<2" "mkdocs-material<10" pillow
          python tools/build.py game "${{ steps.check.outputs.latest }}"
          rm -rf game
          git config user.name "wiki-bot"; git config user.email "wiki-bot@users.noreply.github.com"
          git add -A docs data
          git diff --cached --quiet || git commit -m "Update wiki to v${{ steps.check.outputs.latest }}"
          git push
          mkdocs gh-deploy --force
      - name: Keep the schedule alive
        # GitHub pauses scheduled workflows after 60 days without repo activity.
        if: steps.check.outputs.build != 'true'
        run: |
          LAST=$(git log -1 --format=%ct); NOW=$(date +%s)
          if [ $(( (NOW - LAST) / 86400 )) -ge 45 ]; then
            git config user.name "wiki-bot"; git config user.email "wiki-bot@users.noreply.github.com"
            date -u +%F > data/HEARTBEAT; git add data/HEARTBEAT
            git commit -m "Heartbeat: still watching for new releases" && git push
          fi
